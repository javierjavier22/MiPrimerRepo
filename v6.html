const frame=document.getElementById('site');
frame.addEventListener('load',()=>{

   <article class="service-v6"><div class="service-icon-v6">MIP</div><h3>Manejo Integrado de Plagas</h3><p>Programa continuo basado en diagnóstico, prevención, intervención, monitoreo y mejora.</p><a class="textlink route" href="#industria">Conocer MIP</a></article>

  </div></div></section>`);
 }
 const contact=d.querySelector('#contacto');
 if(contact){

  <section class="section soft"><div class="shell review-wrap-v6"><div class="review-intro-v6"><span class="eyebrow">Experiencias de clientes</span><h2>La confianza también se demuestra con opiniones reales.</h2><p>En producción conviene integrar reseñas verificables de Google y testimonios autorizados de clientes.</p><p style="margin-top:14px;font-size:.74rem">MOCKUP · reemplazar por reseñas reales antes de publicar.</p></div><div class="review-grid-v6"><article class="review-v6"><div class="stars">★★★★★</div><blockquote>“Espacio para una reseña real sobre atención, profesionalismo o resolución.”</blockquote><footer>RESEÑA GOOGLE · CLIENTE REAL</footer></article><article class="review-v6"><div class="stars">★★★★★</div><blockquote>“Espacio para una experiencia verificable de hogar, comercio o empresa.”</blockquote><footer>RESEÑA GOOGLE · CLIENTE REAL</footer></article><article class="review-v6"><div class="stars">★★★★★</div><blockquote>“Para minería e industria, usar testimonios sólo con autorización de publicación.”</blockquote><footer>TESTIMONIO AUTORIZADO · EMPRESA</footer></article></div></div></section>

 }
 /* Reaplicamos listeners de rutas para los vínculos agregados a la demo. */
 d.querySelectorAll('#servicios-v6 .route, .dual-v6 .route').forEach(a=>a.addEventListener('click',()=>{}));
});
